spring.application.name=library-management-system

# Server
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:1112}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:8a4b3c2d1e0f9g8h7i6j5k4l3m2n1o0p8a4b3c2d1e0f9g8h7i6j5k4l3m2n1o0p}
jwt.expiration=86400000

# CORS
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
